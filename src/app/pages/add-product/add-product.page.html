<ion-header>
  <ion-toolbar>
    <ion-title>Agregar Película</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="floating">Nombre</ion-label>
    <ion-input [(ngModel)]="nombre"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Descripción</ion-label>
    <ion-textarea [(ngModel)]="descripcion"></ion-textarea>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Precio</ion-label>
    <ion-input type="number" [(ngModel)]="precio"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label>Imagen</ion-label>
    <input type="file" (change)="capturarImagen($event)" />
  </ion-item>

  <div class="ion-padding ion-text-center">
    <ion-button expand="block" color="primary" (click)="guardarProducto()">
      Guardar
    </ion-button>
    <ion-button expand="block" color="medium" (click)="cerrar()">
      Cancelar
    </ion-button>
  </div>
</ion-content>
