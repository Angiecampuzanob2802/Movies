<ion-header>
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>🎥 CinéFilo</ion-title>

    <ion-buttons slot="end">
      <ion-button class="logout-button" (click)="logout()">
        🚪Cerrar sesión
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content id="main-content" class="ion-padding">
  <video autoplay muted loop playsinline preload="auto" class="background-video">
    <source src="assets/videos/14378-256955039_small.mp4" type="video/mp4" />
    Tu navegador no soporta el video.
  </video>

  <div class="contenido-superior">
    <h2 class="ion-text-center">🎬 ¡Bienvenido, {{ username }}!</h2>

    <div class="cards-container">
      <swiper-container #swiper [config]="slideOpts" class="mySwiper">
        <swiper-slide *ngFor="let pelicula of peliculasDestacadas">
          <ion-card>
            <img [src]="pelicula.imagen" alt="{{ pelicula.titulo }}" />
            <ion-card-header>
              <ion-card-title>{{ pelicula.titulo }}</ion-card-title>
            </ion-card-header>
            <ion-card-content>
              {{ pelicula.descripcion }}
            </ion-card-content>
          </ion-card>
        </swiper-slide>
        <div class="swiper-pagination"></div>
      </swiper-container>
    </div>
  </div>
</ion-content>
<ion-footer>
  <ion-toolbar color="dark" class="footer-toolbar">
    <ion-grid>
      <ion-row class="ion-align-items-center ion-justify-content-between">
        <ion-col size="12" size-md="6" class="ion-text-center ion-text-md-start">
          <p class="footer-text">© 2025 CinéFilo. Todos los derechos reservados.</p>
        </ion-col>
        <ion-col size="12" size-md="6" class="ion-text-center ion-text-md-end"></ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-footer>
