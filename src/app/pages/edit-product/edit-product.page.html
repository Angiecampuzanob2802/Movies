<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Editar Producto</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="product" class="ion-padding">
  <ion-card>
    <ion-card-content>
      <ion-item>
        <ion-label position="floating">Nombre</ion-label>
        <ion-input [(ngModel)]="product.nombre" required></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Descripción</ion-label>
        <ion-input [(ngModel)]="product.descripcion"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Precio</ion-label>
        <ion-input type="number" [(ngModel)]="product.precio" min="0"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Ubicación</ion-label>
        <ion-input [(ngModel)]="product.ubicacion"></ion-input>
      </ion-item>

      <ion-button expand="block" color="success" (click)="guardarCambios()">
        Guardar Cambios
      </ion-button>

      <ion-button expand="block" color="medium" (click)="cancelarEdicion()">
        Cancelar
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
